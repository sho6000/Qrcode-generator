apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.service.name }}
  namespace: {{ .Values.postgres.namespace }}
  labels:
    app: {{ .Values.postgres.service.name }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.postgres.service.name }}
  ports:
  - port: {{ .Values.postgres.service.port }}
    targetPort: {{ .Values.postgres.service.port }}
    protocol: TCP
    name: postgres