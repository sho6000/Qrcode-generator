apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-app-deployment
  namespace: qr-app
  labels:
    app: qr-app-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qr-app-pod
  template:
    metadata:
      labels:
        app: qr-app-pod
    spec:
      containers:
      - name: qr-generator
        image: shoun6000/qr-generator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: streamlit
        
        # Environment variables from ConfigMap
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: qr-app-config
              key: POSTGRES_USER
        
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: qr-app-config
              key: POSTGRES_DB
        
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: qr-app-config
              key: DB_HOST
        
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: qr-app-config
              key: DB_PORT
        
        # Environment variable from Secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: qr-app-secret
              key: POSTGRES_PASSWORD
        
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Health checks
        readinessProbe:
          tcpSocket:
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
        
        livenessProbe:
          tcpSocket:
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10